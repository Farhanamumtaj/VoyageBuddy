<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoyageBuddy – plan your trip in one go</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0f1b2d;
        --sea: #0f9d94;
        --sea-d: #0b7a73;
        --sun: #ffb627;
        --sky: #eaf3f6;
        --card: #fff;
        --mut: #5b6b7f;
        --line: #d5e2e8;
        --r: 18px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: "DM Sans", system-ui, sans-serif;
        background: var(--sky);
        color: var(--ink);
        line-height: 1.55;
      }
      h1,
      h2,
      h3,
      .brand {
        font-family: "Bricolage Grotesque", "DM Sans", sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--sun);
        outline-offset: 2px;
      }
      /* hero */
      .hero {
        background:
          radial-gradient(1200px 500px at 80% -10%, #1d4e63 0, transparent 60%),
          var(--ink);
        color: #fff;
        padding: 28px 20px 90px;
        position: relative;
        overflow: hidden;
      }
      .nav {
        max-width: 1100px;
        margin: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand {
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      .brand span {
        color: var(--sun);
      }
      .hero h1 {
        max-width: 1100px;
        margin: 44px auto 10px;
        font-size: clamp(2.2rem, 6vw, 4.4rem);
        line-height: 1.02;
        letter-spacing: -0.03em;
        font-weight: 800;
      }
      .hero p.sub {
        max-width: 1100px;
        margin: 0 auto 34px;
        color: #b9cad8;
        font-size: 1.1rem;
      }
      .plane {
        position: absolute;
        right: 6%;
        top: 70px;
        font-size: 4rem;
        animation: fly 7s ease-in-out infinite;
      }
      @keyframes fly {
        50% {
          transform: translate(-30px, -18px) rotate(-6deg);
        }
      }
      /* boarding pass form */
      .pass {
        max-width: 1100px;
        margin: 0 auto;
        background: #fff;
        color: var(--ink);
        border-radius: 22px;
        display: grid;
        grid-template-columns: 1fr 230px;
        box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.5);
        position: relative;
      }
      .pass form {
        padding: 26px 28px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px 20px;
      }
      .pass .stub {
        border-left: 2px dashed var(--line);
        padding: 26px 22px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: linear-gradient(160deg, #fff, #f1f8f9);
        border-radius: 0 22px 22px 0;
        position: relative;
      }
      .pass .stub:before,
      .pass .stub:after {
        content: "";
        position: absolute;
        left: -13px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--ink);
      }
      .pass .stub:before {
        top: -12px;
      }
      .pass .stub:after {
        bottom: -12px;
      }
      .field label {
        display: block;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--mut);
        margin-bottom: 4px;
      }
      .field input {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid var(--line);
        border-radius: 12px;
        font: inherit;
        font-size: 1.05rem;
        background: #fff;
        transition: border-color 0.15s;
      }
      .field input:focus {
        border-color: var(--sea);
        outline: none;
      }
      .field.wide {
        grid-column: 1/-1;
      }
      .stepper {
        display: flex;
        align-items: center;
        border: 2px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .stepper button {
        width: 44px;
        height: 46px;
        border: 0;
        background: #f1f8f9;
        font-size: 1.3rem;
        font-weight: 700;
      }
      .stepper button:hover {
        background: var(--sun);
      }
      .stepper input {
        border: 0;
        text-align: center;
        border-radius: 0;
        padding: 12px 0;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .chip {
        border: 1.5px solid var(--line);
        background: #fff;
        border-radius: 99px;
        padding: 3px 12px;
        font-size: 0.85rem;
        color: var(--mut);
      }
      .chip:hover,
      .chip.on {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .go {
        background: var(--sea);
        color: #fff;
        border: 0;
        border-radius: 14px;
        padding: 16px;
        font-weight: 700;
        font-size: 1.1rem;
        transition:
          transform 0.15s,
          background 0.15s;
      }
      .go:hover {
        background: var(--sea-d);
        transform: translateY(-2px);
      }
      .go:disabled {
        opacity: 0.6;
        transform: none;
      }
      .stub b {
        font-family: "Bricolage Grotesque";
        font-size: 2.1rem;
        line-height: 1;
      }
      .stub small {
        color: var(--mut);
      }
      .err {
        grid-column: 1/-1;
        background: #fff1f0;
        border: 1.5px solid #f5a8a0;
        color: #8a2418;
        padding: 10px 14px;
        border-radius: 12px;
      }
      /* loading */
      .load {
        max-width: 600px;
        margin: 70px auto;
        text-align: center;
        padding: 0 20px;
      }
      .route {
        height: 6px;
        background: var(--line);
        border-radius: 9px;
        position: relative;
        margin: 30px 0;
      }
      .route i {
        position: absolute;
        top: -14px;
        font-style: normal;
        font-size: 1.6rem;
        animation: go 2.4s ease-in-out infinite;
      }
      @keyframes go {
        from {
          left: 0;
        }
        to {
          left: calc(100% - 28px);
        }
      }
      .load p {
        color: var(--mut);
        min-height: 1.6em;
      }
      /* results */
      main {
        max-width: 1100px;
        margin: -50px auto 70px;
        padding: 0 20px;
        position: relative;
      }
      .panel {
        background: var(--card);
        border-radius: var(--r);
        padding: 26px;
        box-shadow: 0 10px 30px -15px rgba(15, 27, 45, 0.25);
        margin-top: 22px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .top h2 {
        font-size: 1.9rem;
        letter-spacing: -0.02em;
      }
      .btn2 {
        border: 2px solid var(--ink);
        background: #fff;
        border-radius: 12px;
        padding: 8px 16px;
        font-weight: 700;
      }
      .btn2:hover {
        background: var(--ink);
        color: #fff;
      }
      .tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        margin-top: 22px;
        padding-bottom: 4px;
        position: sticky;
        top: 0;
        background: var(--sky);
        z-index: 5;
        padding-top: 10px;
      }
      .tab {
        border: 0;
        background: #fff;
        padding: 10px 18px;
        border-radius: 99px;
        font-weight: 700;
        color: var(--mut);
        white-space: nowrap;
        border: 1.5px solid var(--line);
      }
      .tab.on {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
        gap: 16px;
        margin-top: 16px;
      }
      .card {
        border: 1.5px solid var(--line);
        border-radius: var(--r);
        padding: 18px;
        background: #fff;
        transition:
          border-color 0.15s,
          transform 0.15s;
        position: relative;
      }
      .card:hover {
        border-color: var(--sea);
        transform: translateY(-3px);
      }
      .card h3 {
        font-size: 1.15rem;
        margin-bottom: 2px;
        padding-right: 34px;
      }
      .mut {
        color: var(--mut);
        font-size: 0.92rem;
      }
      .price {
        font-weight: 800;
        color: var(--sea-d);
      }
      .heart {
        position: absolute;
        right: 12px;
        top: 12px;
        border: 0;
        background: none;
        font-size: 1.4rem;
        transition: transform 0.15s;
      }
      .heart:active {
        transform: scale(1.4);
      }
      .gem {
        display: inline-block;
        background: var(--sun);
        color: var(--ink);
        font-weight: 700;
        font-size: 0.8rem;
        padding: 2px 10px;
        border-radius: 99px;
        margin-bottom: 6px;
      }
      .seg {
        display: flex;
        height: 34px;
        border-radius: 12px;
        overflow: hidden;
        margin: 16px 0 10px;
      }
      .seg div {
        transition: flex 0.3s;
        cursor: pointer;
        min-width: 6px;
      }
      .seg div:hover {
        filter: brightness(1.15);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 22px;
      }
      .legend span {
        display: flex;
        gap: 7px;
        align-items: center;
        font-size: 0.95rem;
      }
      .legend i {
        width: 12px;
        height: 12px;
        border-radius: 4px;
        display: inline-block;
      }
      /* ticket */
      .ticket {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 14px;
        align-items: center;
        border: 1.5px solid var(--line);
        border-radius: var(--r);
        padding: 18px 20px;
        margin-top: 14px;
        background: linear-gradient(90deg, #fff 70%, #f1f8f9);
      }
      .ticket .ico {
        font-size: 2rem;
      }
      .times {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 6px;
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 1.4rem;
      }
      .times .ln {
        flex: 1;
        height: 2px;
        background: repeating-linear-gradient(
          90deg,
          var(--line) 0 6px,
          transparent 6px 12px
        );
        min-width: 40px;
        text-align: center;
      }
      .times small {
        font: 500 0.8rem "DM Sans";
        color: var(--mut);
      }
      /* itinerary */
      .days {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        margin: 14px 0;
      }
      .day {
        min-width: 78px;
        border: 1.5px solid var(--line);
        background: #fff;
        border-radius: 14px;
        padding: 8px;
        text-align: center;
      }
      .day b {
        display: block;
        font-family: "Bricolage Grotesque";
        font-size: 1.3rem;
      }
      .day.on {
        background: var(--sea);
        color: #fff;
        border-color: var(--sea);
      }
      .day.done {
        border-color: var(--sea);
      }
      .bar {
        height: 8px;
        background: var(--line);
        border-radius: 9px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--sea);
        transition: width 0.3s;
      }
      .slot {
        display: flex;
        gap: 14px;
        padding: 16px 0;
        border-bottom: 1px dashed var(--line);
        align-items: flex-start;
      }
      .slot:last-child {
        border: 0;
      }
      .slot input {
        width: 22px;
        height: 22px;
        accent-color: var(--sea);
        margin-top: 3px;
        flex: none;
      }
      .slot.ck p {
        text-decoration: line-through;
        opacity: 0.5;
      }
      .slot h4 {
        font-family: "Bricolage Grotesque";
        font-size: 1.05rem;
      }
      .tips li {
        margin: 6px 0 6px 20px;
      }
      select {
        padding: 8px 12px;
        border-radius: 10px;
        border: 2px solid var(--line);
        font: inherit;
        background: #fff;
      }
      .tog {
        display: flex;
        gap: 8px;
        align-items: center;
        font-weight: 700;
      }
      .tog input {
        width: 20px;
        height: 20px;
        accent-color: var(--sun);
      }
      .row {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }
      footer {
        text-align: center;
        color: var(--mut);
        padding: 0 0 40px;
        font-size: 0.9rem;
      }
      @media (max-width: 820px) {
        .pass {
          grid-template-columns: 1fr;
        }
        .pass .stub {
          border-left: 0;
          border-top: 2px dashed var(--line);
          border-radius: 0 0 22px 22px;
          gap: 14px;
        }
        .pass .stub:before,
        .pass .stub:after {
          display: none;
        }
        .plane {
          display: none;
        }
        .pass form {
          grid-template-columns: 1fr;
        }
        .ticket {
          grid-template-columns: 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      @media print {
        .hero,
        .tabs,
        .btn2,
        .heart {
          display: none;
        }
        main {
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      crossorigin
      src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const inr = (n) => "₹" + Number(n || 0).toLocaleString("en-IN");
      const MSGS = [
        "Checking train and bus timings…",
        "Reading hotel reviews…",
        "Hunting for hidden gems…",
        "Finding where locals eat…",
        "Building your day-by-day plan…",
      ];
      const COLORS = {
        transport: "#0F9D94",
        stay: "#0F1B2D",
        food: "#FFB627",
        activities: "#7C5CFF",
        misc: "#9FB3C2",
      };
      const MODE_ICON = (m) =>
        /train/i.test(m)
          ? "🚆"
          : /bus/i.test(m)
            ? "🚌"
            : /flight|air/i.test(m)
              ? "✈️"
              : "🚗";

      function Stepper({ value, set, min, max }) {
        return (
          <div className="stepper">
            <button
              type="button"
              aria-label="Decrease"
              onClick={() => set(Math.max(min, value - 1))}
            >
              −
            </button>
            <input
              type="number"
              value={value}
              min={min}
              max={max}
              onChange={(e) =>
                set(Math.min(max, Math.max(min, +e.target.value || min)))
              }
            />
            <button
              type="button"
              aria-label="Increase"
              onClick={() => set(Math.min(max, value + 1))}
            >
              +
            </button>
          </div>
        );
      }

      function PlanForm({ onSubmit, loading, error }) {
        const [f, setF] = useState({
          source: "",
          destination: "",
          days: 3,
          persons: 2,
          budget: 25000,
        });
        const up = (k, v) => setF((p) => ({ ...p, [k]: v }));
        const perHead = Math.round(f.budget / f.persons / f.days);
        return (
          <div className="pass">
            <form
              onSubmit={(e) => {
                e.preventDefault();
                onSubmit(f);
              }}
            >
              <div className="field">
                <label htmlFor="s">Leaving from</label>
                <input
                  id="s"
                  required
                  placeholder="Coimbatore"
                  value={f.source}
                  onChange={(e) => up("source", e.target.value)}
                />
              </div>
              <div className="field">
                <label htmlFor="d">Going to</label>
                <input
                  id="d"
                  required
                  placeholder="Munnar"
                  value={f.destination}
                  onChange={(e) => up("destination", e.target.value)}
                />
                <div className="chips">
                  {["Goa", "Jaipur", "Ooty", "Varanasi"].map((c) => (
                    <button
                      type="button"
                      key={c}
                      className={"chip" + (f.destination === c ? " on" : "")}
                      onClick={() => up("destination", c)}
                    >
                      {c}
                    </button>
                  ))}
                </div>
              </div>
              <div className="field">
                <label>Number of days</label>
                <Stepper
                  value={f.days}
                  set={(v) => up("days", v)}
                  min={1}
                  max={14}
                />
              </div>
              <div className="field">
                <label>Number of travellers</label>
                <Stepper
                  value={f.persons}
                  set={(v) => up("persons", v)}
                  min={1}
                  max={20}
                />
              </div>
              <div className="field wide">
                <label htmlFor="b">Total budget: {inr(f.budget)}</label>
                <input
                  id="b"
                  type="range"
                  min="3000"
                  max="300000"
                  step="1000"
                  value={f.budget}
                  onChange={(e) => up("budget", +e.target.value)}
                  style={{ padding: 0, accentColor: "#0F9D94" }}
                />
              </div>
              {error && (
                <div className="err" role="alert">
                  {error}
                </div>
              )}
              <button
                className="go wide field"
                style={{ gridColumn: "1/-1" }}
                disabled={loading}
              >
                {loading ? "Planning…" : "Plan my trip"}
              </button>
            </form>
            <div className="stub">
              <div>
                <small>Your daily budget</small>
                <br />
                <b>{inr(perHead)}</b>
                <br />
                <small>per person, per day</small>
              </div>
              <div>
                <small>
                  {f.persons} traveller{f.persons > 1 ? "s" : ""} · {f.days} day
                  {f.days > 1 ? "s" : ""}
                </small>
                <br />
                <small>
                  {f.source || "Anywhere"} → {f.destination || "Anywhere"}
                </small>
              </div>
            </div>
          </div>
        );
      }

      function Loading() {
        const [i, setI] = useState(0);
        useEffect(() => {
          const t = setInterval(() => setI((x) => (x + 1) % MSGS.length), 2600);
          return () => clearInterval(t);
        }, []);
        return (
          <div className="load">
            <h2>Searching the web for you</h2>
            <div className="route">
              <i>✈️</i>
            </div>
            <p>{MSGS[i]}</p>
          </div>
        );
      }

      function Overview({ plan, input }) {
        const b = plan.budgetBreakdown || {};
        const total = Object.values(b).reduce((a, c) => a + (+c || 0), 0) || 1;
        const [hov, setHov] = useState(null);
        return (
          <div className="panel">
            <p>{plan.summary}</p>
            <h3 style={{ marginTop: 22 }}>Where your money goes</h3>
            <div className="seg">
              {Object.keys(COLORS).map((k) => (
                <div
                  key={k}
                  onMouseEnter={() => setHov(k)}
                  onMouseLeave={() => setHov(null)}
                  style={{ flex: b[k] || 0.01, background: COLORS[k] }}
                  title={k + ": " + inr(b[k])}
                />
              ))}
            </div>
            <div className="legend">
              {Object.keys(COLORS).map((k) => (
                <span key={k} style={{ fontWeight: hov === k ? 700 : 400 }}>
                  <i style={{ background: COLORS[k] }} />
                  {k[0].toUpperCase() + k.slice(1)} {inr(b[k])} (
                  {Math.round(((b[k] || 0) / total) * 100)}%)
                </span>
              ))}
            </div>
            <p className="mut" style={{ marginTop: 14 }}>
              Estimated total {inr(total)} of your {inr(input.budget)} budget.{" "}
              {plan.budgetVerdict}
            </p>
            {plan.tips?.length > 0 && (
              <>
                <h3 style={{ marginTop: 22 }}>Good to know</h3>
                <ul className="tips">
                  {plan.tips.map((t, i) => (
                    <li key={i}>{t}</li>
                  ))}
                </ul>
              </>
            )}
          </div>
        );
      }

      function Transport({ plan, input }) {
        return (
          <div className="panel">
            <h3>How to get there</h3>
            {(plan.transport || []).map((t, i) => (
              <div className="ticket" key={i}>
                <div className="ico">{MODE_ICON(t.mode)}</div>
                <div>
                  <b>{t.name}</b>{" "}
                  <span className="mut">
                    {t.number} · {t.mode}
                  </span>
                  <div className="times">
                    <span>{t.departure}</span>
                    <span className="ln">
                      <small>{t.duration}</small>
                    </span>
                    <span>{t.arrival}</span>
                  </div>
                  <p className="mut" style={{ marginTop: 6 }}>
                    {t.notes}
                  </p>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div className="price">{inr(t.farePerPerson)}</div>
                  <div className="mut">per person</div>
                  <div className="mut">
                    <b>{inr(t.farePerPerson * input.persons)}</b> for{" "}
                    {input.persons}
                  </div>
                </div>
              </div>
            ))}
          </div>
        );
      }

      function Hotels({ plan, favs, toggle }) {
        const [sort, setSort] = useState("rating");
        const list = useMemo(
          () =>
            [...(plan.hotels || [])].sort((a, b) =>
              sort === "price"
                ? a.pricePerNight - b.pricePerNight
                : b.rating - a.rating,
            ),
          [plan, sort],
        );
        return (
          <div className="panel">
            <div className="row">
              <h3>Top 10 places to stay</h3>
              <select
                aria-label="Sort hotels"
                value={sort}
                onChange={(e) => setSort(e.target.value)}
              >
                <option value="rating">Best rated</option>
                <option value="price">Lowest price</option>
              </select>
            </div>
            <div className="grid">
              {list.map((h) => (
                <div className="card" key={h.name}>
                  <button
                    className="heart"
                    aria-label="Save hotel"
                    onClick={() => toggle(h.name)}
                  >
                    {favs.includes(h.name) ? "❤️" : "🤍"}
                  </button>
                  <h3>{h.name}</h3>
                  <div className="mut">
                    {h.area} · ⭐ {h.rating}
                  </div>
                  <p style={{ margin: "8px 0" }}>{h.highlight}</p>
                  <span className="price">{inr(h.pricePerNight)}</span>{" "}
                  <span className="mut">/ night</span>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function Food({ plan }) {
        return (
          <div className="panel">
            <h3>Where to eat</h3>
            <div className="grid">
              {(plan.restaurants || []).map((r) => (
                <div className="card" key={r.name}>
                  <h3>{r.name}</h3>
                  <div className="mut">
                    {r.cuisine}
                    {r.area ? " · " + r.area : ""}
                  </div>
                  <p style={{ margin: "8px 0" }}>🍽️ Try: {r.mustTry}</p>
                  <span className="price">{inr(r.priceForTwo)}</span>{" "}
                  <span className="mut">for two</span>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function Spots({ plan }) {
        const [gems, setGems] = useState(false);
        const list = (plan.spots || []).filter((s) => !gems || s.hidden);
        return (
          <div className="panel">
            <div className="row">
              <h3>Places to see</h3>
              <label className="tog">
                <input
                  type="checkbox"
                  checked={gems}
                  onChange={(e) => setGems(e.target.checked)}
                />
                Hidden gems only
              </label>
            </div>
            <div className="grid">
              {list.map((s) => (
                <div className="card" key={s.name}>
                  {s.hidden && <span className="gem">Hidden gem</span>}
                  <h3>{s.name}</h3>
                  <div className="mut">{s.type}</div>
                  <p style={{ margin: "8px 0" }}>{s.description}</p>
                  <div className="mut">
                    Best time: {s.bestTime || "Anytime"} · Entry:{" "}
                    {s.entryFee || "Free"}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function Itinerary({ plan }) {
        const items = plan.itinerary || [];
        const [cur, setCur] = useState(0);
        const [done, setDone] = useState({});
        const slots = ["morning", "afternoon", "evening"];
        const icons = { morning: "🌅", afternoon: "☀️", evening: "🌙" };
        const totalSlots = items.length * 3,
          doneCount = Object.values(done).filter(Boolean).length;
        const d = items[cur];
        if (!d) return null;
        const dayDone = (i) => slots.every((s) => done[i + s]);
        return (
          <div className="panel">
            <h3>Day-by-day plan</h3>
            <div className="bar" style={{ margin: "10px 0 4px" }}>
              <i style={{ width: (doneCount / totalSlots) * 100 + "%" }} />
            </div>
            <div className="mut">
              {doneCount} of {totalSlots} activities ticked off
            </div>
            <div className="days">
              {items.map((x, i) => (
                <button
                  key={i}
                  className={
                    "day" +
                    (i === cur ? " on" : "") +
                    (dayDone(i) ? " done" : "")
                  }
                  onClick={() => setCur(i)}
                >
                  Day<b>{x.day}</b>
                </button>
              ))}
            </div>
            <h3>{d.title}</h3>
            <div className="mut">Estimated spend {inr(d.estCost)}</div>
            {slots.map((s) => (
              <label key={s} className={"slot" + (done[cur + s] ? " ck" : "")}>
                <input
                  type="checkbox"
                  checked={!!done[cur + s]}
                  onChange={(e) =>
                    setDone((p) => ({ ...p, [cur + s]: e.target.checked }))
                  }
                />
                <div>
                  <h4>
                    {icons[s]} {s[0].toUpperCase() + s.slice(1)}
                  </h4>
                  <p>{d[s]}</p>
                </div>
              </label>
            ))}
          </div>
        );
      }

      function App() {
        const [state, setState] = useState("form"); // form | loading | done
        const [plan, setPlan] = useState(null),
          [input, setInput] = useState(null),
          [error, setError] = useState("");
        const [tab, setTab] = useState("Overview");
        const [favs, setFavs] = useState([]);
        const toggle = (n) =>
          setFavs((f) =>
            f.includes(n) ? f.filter((x) => x !== n) : [...f, n],
          );

        async function submit(f) {
          setError("");
          setInput(f);
          setState("loading");
          try {
            const r = await fetch("/api/plan", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(f),
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data.error || "Something went wrong.");
            setPlan(data);
            setTab("Overview");
            setState("done");
            setTimeout(
              () =>
                document
                  .getElementById("results")
                  ?.scrollIntoView({ behavior: "smooth" }),
              100,
            );
          } catch (e) {
            setError(e.message);
            setState("form");
          }
        }
        const TABS = [
          "Overview",
          "Transport",
          "Stay",
          "Food",
          "Places",
          "Itinerary",
        ];
        return (
          <>
            <header className="hero">
              <div className="nav">
                <div className="brand">
                  Voyage<span>Buddy</span>
                </div>
                <span style={{ color: "#B9CAD8" }}>Powered by Groq</span>
              </div>
              <span className="plane" aria-hidden="true">
                ✈️
              </span>
              <h1>
                Tell us your budget.
                <br />
                We’ll plan the trip.
              </h1>
              <p className="sub">
                Trains and buses with real timings, ten places to stay, the food
                locals love, hidden spots and a plan for every day.
              </p>
              <PlanForm
                onSubmit={submit}
                loading={state === "loading"}
                error={error}
              />
            </header>
            {state === "loading" && <Loading />}
            {state === "done" && plan && (
              <main id="results">
                <div className="panel top">
                  <div>
                    <h2>
                      {input.source} → {input.destination}
                    </h2>
                    <div className="mut">
                      {input.days} days · {input.persons} traveller
                      {input.persons > 1 ? "s" : ""} · {inr(input.budget)}
                      {favs.length > 0 &&
                        ` · ${favs.length} saved hotel${favs.length > 1 ? "s" : ""}`}
                    </div>
                  </div>
                  <button className="btn2" onClick={() => window.print()}>
                    Print or save as PDF
                  </button>
                </div>
                <div className="tabs" role="tablist">
                  {TABS.map((t) => (
                    <button
                      key={t}
                      role="tab"
                      aria-selected={tab === t}
                      className={"tab" + (tab === t ? " on" : "")}
                      onClick={() => setTab(t)}
                    >
                      {t}
                    </button>
                  ))}
                </div>
                {tab === "Overview" && <Overview plan={plan} input={input} />}
                {tab === "Transport" && <Transport plan={plan} input={input} />}
                {tab === "Stay" && (
                  <Hotels plan={plan} favs={favs} toggle={toggle} />
                )}
                {tab === "Food" && <Food plan={plan} />}
                {tab === "Places" && <Spots plan={plan} />}
                {tab === "Itinerary" && <Itinerary plan={plan} />}
              </main>
            )}
            <footer>
              AI-generated plans can be out of date. Confirm train timings and
              prices before you book.
            </footer>
          </>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
